message ColumnarFetchUserActionResponse {
  repeated int64 user_id_seq = 1;
  repeated uint64 tweet_id_seq = 2;
  repeated uint64 author_id_seq = 3;
  repeated int64 impressed_time_ms_seq = 4;
  repeated uint32 action_seq = 5;
  repeated uint32 history_length_seq = 6;
}

