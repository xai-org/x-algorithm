syntax = "proto3";

package xai.recsys.v1;

option java_package = "com.x.user_action_sequence";
option java_outer_classname = "proto_java";
option java_multiple_files = true;

service RecsysPredictor {
  rpc PredictNextActions(PredictNextActionsRequest)
      returns (PredictNextActionsResponse) {}

  rpc ReloadModel(ReloadModelRequest) returns (ReloadModelResponse) {}
}

service RecsysRetrievalPredictor {
  rpc RetrieveTopKCandidates(RetrieveTopKCandidatesRequest)
      returns (RetrieveTopKCandidatesResponse) {}

  rpc ScorePosts(ScorePostsRequest) returns (ScorePostsResponse) {}

  rpc ReloadModel(ReloadModelRequest) returns (ReloadModelResponse) {}
}

enum FeedRequestContext {
  FEED_REQUEST_CONTEXT_UNKNOWN = 0;
  FEED_REQUEST_CONTEXT_OTHER = 1;
  FEED_REQUEST_CONTEXT_LAUNCH = 2;
  FEED_REQUEST_CONTEXT_FOREGROUND = 3;
  FEED_REQUEST_CONTEXT_FOREGROUND_TRUNCATE = 4;
  FEED_REQUEST_CONTEXT_PULL_TO_REFRESH = 5;
  FEED_REQUEST_CONTEXT_MANUAL_REFRESH = 6;
  FEED_REQUEST_CONTEXT_NAVIGATE = 7;
  FEED_REQUEST_CONTEXT_VIEWPORT_AWARE_REFRESH = 8;
  FEED_REQUEST_CONTEXT_POLLING = 9;
  FEED_REQUEST_CONTEXT_BACKGROUND_FETCH = 10;
  FEED_REQUEST_CONTEXT_GAP = 11;
  FEED_REQUEST_CONTEXT_SIGNUP = 12;
  FEED_REQUEST_CONTEXT_TWEET_SELF_THREAD = 13;
  FEED_REQUEST_CONTEXT_AUTO = 14;
}

enum FeedCursorDirection {
  FEED_CURSOR_DIRECTION_UNKNOWN = 0;
  FEED_CURSOR_DIRECTION_INITIAL = 1;
  FEED_CURSOR_DIRECTION_TOP = 2;
  FEED_CURSOR_DIRECTION_BOTTOM = 3;
  FEED_CURSOR_DIRECTION_GAP = 4;
}

message ClientContext {
  int64 user_id = 1;
  int64 guest_id = 2;
  int64 app_id = 3;
  string ip_address = 4;
  string user_agent = 5;
  string country_code = 6;
  string language_code = 7;
  bool is_twoffice = 9;
  repeated string user_roles = 10;
  string device_id = 11;
  string mobile_device_id = 12;
  string mobile_device_ad_id = 13;
  bool limit_ad_tracking = 14;
  int64 guest_id_ads = 15;
  int64 guest_id_marketing = 16;
  int64 authenticated_user_id = 17;
  bool is_verified_crawler = 18;
  int64 guest_token = 19;
  string client_version = 20;
  string time_zone = 21;
  string device_network_type = 23;
}

message UserContext {
  int32 user_age_bracket = 1;
  int32 user_gender = 2;
  int32 user_state = 3;
  repeated bool followed_grok_topics = 4;
  repeated bool followed_starter_packs = 5;
  float user_longitude = 6;
  float user_latitude = 7;
  int32 user_dma_code = 8;
  repeated bool inferred_grok_topics = 9;
  int32 user_age_in_years = 10;
  int32 user_inferred_gender = 11;
  float user_inferred_gender_score = 12;
  repeated bool user_installed_apps = 13;
  int32 user_followers_count = 14;
  int32 user_following_count = 15;
  int32 user_blockers_count = 16;
  int32 user_muters_count = 17;
  bool is_nsfw_user = 18;
  bool is_nsfw_mode = 19;
  bytes id_list_features_ipc = 20;
  RecentSearchQueries recent_search_queries = 21;
}

message EngagementCountRow {
  int32 action = 1;
  repeated uint32 counts = 2;
}

message EngagementCounts {
  bool present = 1;
  repeated uint32 window_secs = 2;
  repeated EngagementCountRow rows = 3;
  int64 updated_at_ms = 4;
  int64 window_end_ms = 5;
  repeated int32 collected_actions = 6;
}

message ConversionHistoryContext {
  float hist_user_total_convs = 1;
  float hist_user_unique_advs = 2;
  float hist_user_recency_days = 3;
  float hist_user_det_ratio = 4;
  float hist_user_has_conv = 5;

  repeated int32 hist_adv_hashes = 6;

  repeated float per_candidate_features = 7;

  repeated int32 per_candidate_account_hashes = 8;
}

message RecentSearchQueries {
  repeated RecentSearchQuery queries = 1;
}

message RecentSearchQuery {
  string query = 1;
  int64 timestamp_ms = 2;
  bytes embedding_bf16 = 3;
}

message PredictNextActionsRequest {
  repeated UserActionSequence sequences = 1;

  repeated CandidateSet candidateSets = 2;

  bool returnLogprob = 3;

  uint32 topLogprobsNum = 4;

  string metadata = 5;

  optional uint64 load_ticket_id = 6;

  repeated AdsCandidateSet adsCandidateSets = 7;

  string intermediateTensorsPath = 8;

  bool returnLogMap = 9;

  repeated uint32 requestedActionIndices = 10;

  bool returnCandidateTweetIdOnly = 11;

  ClientContext clientContext = 12;

  repeated bytes columnar_sequences = 13;

  UserContext userContext = 14;

  ConversionHistoryContext conversionHistory = 15;

  optional uint64 seedTweetId = 16;

  repeated uint32 requestedContinuousActionIndices = 17;

  repeated ConvAssetIds conv_asset_ids = 18;

  PageDecodeParams pageDecode = 19;

  bool returnBackboneScores = 20;

  map<string, string> experiment_overrides = 21;

  bool returnLogitsList = 22;

  repeated PurchaseValueBaseline purchase_value_baselines = 23;
  EngagementCounts user_ads_engagement_counts = 24;

  FeedRequestContext feed_request_context = 25;
  FeedCursorDirection feed_cursor_direction = 26;

  bool hydrate_history_url_embeddings = 27;
}

message PurchaseValueBaseline {
  int64 impression_id = 1;
  int64 advertiser_account_id = 2;
  double mean_value_usd_28d = 3;
  double mean_value_usd_28d_vt = 4;
  double mean_content_view_usd_28d = 5;
  double mean_add_to_cart_usd_28d = 6;
  double mean_content_view_usd_28d_vt = 7;
  double mean_add_to_cart_usd_28d_vt = 8;
}

message PageDecodeParams {
  uint32 poolN = 1;

  uint32 steps = 2;

  float temperature = 3;

  RankingScoreWeights rankingScoreWeights = 4;

  optional float diversityWeight = 5;

  optional uint32 rewardHead = 6;
}

message RankingScoreWeights {
  float favoriteWeight = 1;
  float replyWeight = 2;
  float retweetWeight = 3;
  float clickWeight = 4;
  float profileClickWeight = 5;
  float vqvWeight = 6;
  float shareWeight = 7;
  float quoteWeight = 8;
  float contDwellTimeWeight = 9;
  float notInterestedWeight = 10;
  float reportWeight = 11;
  float notDwelledWeight = 12;
  float minVideoDurationMs = 13;
  float shareViaDmWeight = 14;
  float shareViaCopyLinkWeight = 15;
}

message PageDecodeResult {
  repeated uint32 pickedIndices = 1;

  repeated float pickedProbs = 2;

  repeated float pickedScores = 3;
}

message ConvAssetIds {
  repeated int64 impressed_time_ms = 1;
  repeated int64 author_id = 2;
  repeated int64 asset_id = 3;
}

message PredictNextActionsResponse {
  repeated CandidateDistributionSet distributionSets = 1;

  ClientContext clientContext = 2;

  optional string servingPodName = 3;
  optional string servingNodeName = 4;

  optional uint64 checkpointLoadDelaySeconds = 5;
}

message ReloadModelRequest {
  bool do_reload = 1;
  repeated string copy_urls = 2;
  string target_prefix = 3;
}

message ReloadModelResponse {
  bool reload_in_progress = 1;
  double current_checkpoint_timestamp = 2;
  string serving_prefix = 3;
  bool peer_ready = 4;
}

message RetrieveTopKCandidatesRequest {
  repeated uint64 user_ids = 1;

  repeated UserActionSequence sequences = 2;

  uint32 topK = 3;

  string metadata = 4;

  optional uint64 load_ticket_id = 5;

  repeated uint64 topic_entity_ids = 6;

  optional int32 topic_filter_mode = 7;

  repeated bytes columnar_sequences = 8;

  ClientContext client_context = 9;

  bytes eligible_posts_bloom_filter = 10;

  repeated float search_query_embedding = 11;

  UserContext user_context = 12;

  uint32 num_cold_start_to_retrieve = 13;

  repeated uint64 seed_post_ids = 14;

  repeated ExcludedPostsBloomFilter excluded_posts_bloom_filters = 15;

  repeated uint64 excluded_post_ids = 16;

  map<string, float> value_model_weights = 17;

  repeated uint64 include_author_ids = 18;

  repeated uint64 exclude_author_ids = 19;
}

message ExcludedPostsBloomFilter {
  repeated fixed64 bit_array = 1;
  int32 size_cap = 2;
  double false_positive_rate = 3;
}

message RetrieveTopKCandidatesResponse {
  repeated ScoredCandidates topKCandidates = 1;
}

message ScorePostsRequest {
  uint64 user_id = 1;
  bytes columnar_sequence = 2;
  ClientContext client_context = 3;
  UserContext user_context = 4;
  repeated uint64 post_ids = 5;

  repeated uint32 requested_actions = 6;
  repeated uint32 post_action_masks = 7;
}

message ScorePostsResponse {
  PostActionScores scores = 1;
}

message PostActionScores {
  repeated uint32 action_indices = 1;

  uint32 num_posts = 2;

  bytes probabilities_bf16 = 3;

  bytes found = 4;

  repeated uint32 post_action_masks = 5;
}

message DeviceFeature {
  CountryCode engagingIpCountryCode = 1;
  DeviceNetworkType deviceNetworkType = 2;
  Timezone timezone = 3;
  string ipAddress = 4;
}

message CandidateSet {
  uint64 userId = 1;

  repeated TweetInfo candidates = 2;

  ProductSurface productSurface = 3;

  repeated float searchQueryEmbedding = 4;

  DeviceFeature deviceFeature = 5;

  optional int64 requestTimestampMs = 6;
}

message CandidateDistributionSet {
  uint64 userId = 1;

  repeated NextActionDistribution candidateDistributions = 2;
  string checkpointPath = 3;

  string intermediateTensorsPath = 4;

  PageDecodeResult pageDecodeResult = 5;
}

message ScoredCandidates {
  uint64 userId = 1;

  repeated ScoredCandidate candidates = 2;
}

enum RetrievalDatasetType {
  RETRIEVAL_DATASET_TYPE_PAD = 0;
  RETRIEVAL_DATASET_TYPE_HOME = 1;
  RETRIEVAL_DATASET_TYPE_IMMERSIVE_2_DAY = 2;
  RETRIEVAL_DATASET_TYPE_RELEVANT_ADS = 3;
  RETRIEVAL_DATASET_TYPE_CAROUSEL_ADS = 4;
  RETRIEVAL_DATASET_TYPE_EVERGREEN = 5;
  RETRIEVAL_DATASET_TYPE_IMMERSIVE_NSFW = 6;
  RETRIEVAL_DATASET_TYPE_ACTIVE_ADS = 7;
  RETRIEVAL_DATASET_TYPE_IMMERSIVE_4_DAY = 8;
  RETRIEVAL_DATASET_TYPE_IMAGINE = 9;
  RETRIEVAL_DATASET_TYPE_TAIL = 10;
  RETRIEVAL_DATASET_TYPE_DPA_PRODUCTS = 11;
  RETRIEVAL_DATASET_TYPE_TRENDING = 12;
  RETRIEVAL_DATASET_TYPE_HOME_COLD = 13;
  RETRIEVAL_DATASET_TYPE_HOME_HOT = 14;
  RETRIEVAL_DATASET_TYPE_ZERO_FAV = 16;
  reserved 17, 18;
  RETRIEVAL_DATASET_TYPE_IMMERSIVE_32FAV_VIDEO_14_TO_30_DAY = 19;
}

message ScoredCandidate {
  TweetInfo candidate = 1;

  float score = 2;

  int32 sourceIdx = 3;

  uint32 datasetType = 4;
}

message NextActionDistribution {
  TweetInfo candidate = 1;

  repeated float logits = 2;

  repeated float topLogProbs = 3;

  AdInfo adInfo = 4;

  map<uint32, float> indexToLogits = 5;

  repeated float continuousActionsValues = 6;

  map<uint32, float> indexToContinuousValues = 7;

  RewardOutputs rewardOutputs = 8;

  SlateContext slateContext = 9;

  repeated float backboneTopLogProbs = 10;
  repeated float backboneContinuousValues = 11;

  repeated float requestedActionLogits = 12;
}

message RewardOutputs {
  repeated float values = 1;

  repeated float policyLogits = 2;
}

