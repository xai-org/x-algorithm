[project]
name = "bdsm"
version = "2.0.0"
description = "Behavioral inauthentic-account detection: sequence-of-actions transformer, task heads, and streaming enforcement pipeline."
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "protobuf>=6.31",
    "confluent-kafka",
    "redis",
    "pyarrow",
    "pyyaml",
    "zstandard",
    "requests",
    "google-cloud-bigquery",
    "google-cloud-bigquery-storage",
]

[project.optional-dependencies]
gpu = [
    "optax",
]
training = [
    "scikit-learn",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
py-modules = []
packages = ["runtime", "runtime.proto_gen", "training"]

[tool.setuptools.package-data]
runtime = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"
target-version = "py310"
line-length = 100

[tool.vulture]
min_confidence = 90
ignore_names = ["exc_type", "exc_value", "exc_tb"]
