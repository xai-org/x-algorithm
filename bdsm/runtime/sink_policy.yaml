
version: "2026-08-14"

# Public-release note: the operating points below (the 2-D
# [tau, lambda] pairs, cusp_delta, reply_spam_hard_suspend_tau, and
# the min_actions_for_enforcement count gate) are REDACTED in the
# open-source export. Probabilities are replaced with an out-of-range
# 9.99 sentinel (these fields live in [0, 1], so a 9.99 threshold
# never fires and is plainly a stub, not a real value); the action
# count with an impossible 999999 (far longer than any scoreable
# sequence, so the gate can never pass). The production values are
# configured internally and are not part of this release. Structure,
# head names, and the action map are real.

