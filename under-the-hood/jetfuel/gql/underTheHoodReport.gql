query UserUnderTheHoodReport {
  user_under_the_hood_report(safety_level: FilterAll) {
    report_json
    report_info {
      report_period
      served_period
      target_period
      period_status
      next_report_not_before
      eligibility_checks {
        key
        value
      }
      note {
        ...TimelineRichText
      }
    }
  }
}
