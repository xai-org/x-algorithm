query UserUnderTheHoodReport {
  user_under_the_hood_report(safety_level: FilterAll) {
    report_json
    report_info {
      report_period
      eligibility_checks {
        key
        value
      }
      note {
        ...TimelineRichText
      }
      post_label_appeals {
        key
        value {
          ...TimelineRichText
        }
      }
      account_label_appeals {
        key
        value {
          ...TimelineRichText
        }
      }
      max_post_ids_per_label
    }
  }
}
